services:
  db:
    image: postgres:15-alpine
    container_name: prospectbot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: prospectbot
      POSTGRES_PASSWORD: prospectbot
      POSTGRES_DB: prospectbot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
